<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories items</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://code.iconify.design/2/2.0.0-rc1/iconify.min.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
            background-color: #343a40;
            color: white;
            position: relative;
            z-index: 5;
        }
        .nav-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            text-align: center;
            flex-grow: 1; 
        }
        .container {
            display: inline-block;
            cursor: pointer;
            z-index: 4;
            position: relative;
            margin: 15px;
        }
        .bar1, .bar2, .bar3 {
            width: 35px;
            height: 5px;
            background-color: #fff;
            margin: 6px 0;
            transition: transform 0.4s, background-color 0.4s;
        }
        .change .bar1 {
            transform: translate(0, 11px) rotate(-45deg);
            background-color: red;
        }
        .change .bar2 {
            opacity: 0;
        }
        .change .bar3 {
            transform: translate(0, -11px) rotate(45deg);
            background-color: red;
        }
        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 3;
            top: 0;
            left: 0;
            background-color: #343a40;
            overflow-x: hidden;
            transition: width 0.5s;
            padding-top: 110px;
            text-align: center;
        }
        .sidenav button {
            padding: 8px 0;
            text-decoration: none;
            font-size: 25px;
            font-weight: bold;
            color: #ffffff;
            display: block;
            width: 80%;
            margin: 20px auto; 
            transition: color 0.3s, background-color 0.3s;
            background: #333;
            border: 2px solid white;
            border-radius: 15px;
            cursor: pointer;
        }
        .sidenav button:hover {
            color: #6a00ff;
            background-color: #555;
            box-shadow: 0 0 1px 2px white;
        }
        .sidenav hr {
            height: 2px;
            border-width: 0;
            color: gray;
            background-color: gray;
            margin: 20px 0;
        }
        .categories-section, .sort-section {
            display: none;
            text-align: center;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(-20px);
            transition: opacity 0.5s, max-height 0.5s, transform 0.5s;
        }
        .categories-section {
            max-height: 300px;
            overflow-y: scroll;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .categories-section::-webkit-scrollbar {
            display: none;
        }
        .categories-section button, .sort-section button {
            text-align: center;
            display: block;
            width: 80%;
            margin: 20px auto; 
            padding: 8px 0;
            font-size: 25px;
            font-weight: bold;
            color: #ffffff;
            background: #333;
            border: 2px solid white;
            border-radius: 15px;
            cursor: pointer;
        }
        .categories-section button:hover, .sort-section button:hover {
            color: #ffcc00;
            background-color: #555;
        }
        .cart-btn {
            position: relative;
            display: inline-block;
            margin: 15px;
            cursor: pointer;
        }
        .cart-btn .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            border-radius: 50%;
            padding: 2px 5px;
            font-size: 0.8rem;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 2;
            transition: display 0.5s;
        }
        .items-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 40px;
            margin-top: 20px;
        }
        .items-box {
            width: 100%;
            max-width: 300px;
            border-radius: 0; 
            overflow: hidden;
            background-color: #fff;
            text-align: center;
            position: relative;
            transition: box-shadow 0.5s ease; 
            outline: 1px solid #333;
        }
        .items-box:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); 
        }
        .image-container {
            width: 100%;
            padding-bottom: 100%;
            position: relative;
            overflow: hidden;
        }
        .image, .image-hover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }
        .image-hover {
            opacity: 0;
        }
        .items-box:hover .image-hover {
            opacity: 1;
        }
        .items-box:hover .image {
            opacity: 0;
        }
        .info {
            padding: 16px;
            position: relative;
        }
        .add-items-btn {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #6a00ff;
            color: #fff;
            border: none; 
            border-radius: 0; 
            cursor: pointer;
            font-size: 1em;
            padding: 15px 20px;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            width: calc(100% - 32px); 
        }
        .items-box:hover .add-items-btn {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .items-names {
            font-size: 1.2em;
            color: #333;
            margin: 16px 0;
            position: relative;
        }
        .qty-quantity {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff0000;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            z-index: 1; 
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 10px 20px;
            }
            .nav-title {
                font-size: 1.5rem;
                margin-bottom: 10px;
            }
            .items-container {
                padding: 20px;
            }
            .items-box {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .theme-category {
                font-size: 16px;
                padding: 8px 16px;
            }
            .items-container {
                padding: 10px;
            }
            .items-box {
                max-width: 100%;
            }
        }

        .notification {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #ffffff;
            padding: 9px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #6a00ff;
            position: fixed;
            top: 30px; 
            right: 20px;
            width: 300px;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(-20px);
            
        }

        .notification.show {
        display: flex;
        opacity: 1;
        transform: translateY(0);
    }

    .notification.hide {
        transform: translateY(-20px);
    }

    .notification-body {
        margin-bottom: 10px;
        text-align: center;
    }

    .notification-actions {
        margin-top: 10px;
    }

    .notification-actions .btn {
        background-color: #6a00ff;
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
    }

    .notification-actions .btn:hover {
        background-color: #6a00ff;
    }

    .search-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 10px 0;
    }
    .search-bar input {
        width: 80%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    .search-bar button {
        padding: 10px;
        font-size: 16px;
        background-color: #6a00ff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-left: 10px;
    }
    .search-bar button:hover {
        background-color: #6a00ff;
    }

    </style>
</head>
<body>
    <header>
        <div class="container" onclick="toggleNav(this)">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
        <div class="nav-title">CATEGORIES ITEMS</div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by category or item name...">
            <button onclick="searchItems()">Search</button>
        </div>
    </header>

    <div id="mySidenav" class="sidenav">
        <button onclick="window.location.href='Home.html'"><i class="fa fa-fw fa-home"></i> HOME</button>
        <hr>
        <button class="cart-btn" onclick="redirectToCart()">
            <i class="fa fa-fw fa-shopping-cart"></i> CART
            <span class="cart-count">0</span>
        </button>
        <hr>
        <button onclick="toggleCategories()">CATEGORY</button>
        <div class="categories-section" id="categoriesSection">
            <button onclick="filterItems('all')">All</button>
            <button onclick="filterItems('Cooking Pot')">Cooking Pot</button>
            <button onclick="filterItems('Frying Pans')">Frying Pans</button>
            <button onclick="filterItems('Plates & Bowls')">Plates & Bowls</button>
            <button onclick="filterItems('Cutlery')">Cutleries</button>
            <button onclick="filterItems('Cups & Glasses')">Glassware</button>
            <button onclick="filterItems('Serving Trays')">Serving Trays</button>
            <button onclick="filterItems('Napkins & Tableware')">F&B equipment</button>
        </div>
        <button onclick="toggleSort()">SORT</button>
        <div class="sort-section" id="sortSection">
            <button onclick="sortItems('az')">A - Z</button>
            <button onclick="sortItems('za')">Z - A</button>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="toggleNav(document.querySelector('.container'))"></div>
    
    <div class="items-container" id="items-container">
    </div>

    <div id="notification" class="notification" role="alert">
        <div class="notification-body">
            <p id="notificationMessage">A product has been added to your cart. 1x</p>
        </div>
        <div class="notification-actions">
            <button type="button" class="btn btn-small btn-primary" onclick="redirectToCart()">Go To Cart</button>
        </div>
    </div>
    
    <script>
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
            document.getElementById("overlay").style.display = "block";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }

        function toggleNav(x) {
            x.classList.toggle("change");
            if (document.getElementById("mySidenav").style.width === "250px") {
                closeNav();
            } else {
                openNav();
            }
        }

        function toggleCategories() {
            var categoriesSection = document.getElementById("categoriesSection");
            var sortSection = document.getElementById("sortSection");
            if (sortSection.style.display === "block") {
                toggleSort();
            }
            if (categoriesSection.style.display === "none" || categoriesSection.style.display === "") {
                categoriesSection.style.display = "block";
                setTimeout(() => {
                    categoriesSection.style.opacity = "1";
                    categoriesSection.style.maxHeight = "300px"; 
                    categoriesSection.style.transform = "translateY(0)";
                }, 10);
            } else {
                categoriesSection.style.opacity = "0";
                categoriesSection.style.maxHeight = "0";
                categoriesSection.style.transform = "translateY(-20px)";
                setTimeout(() => {
                    categoriesSection.style.display = "none";
                }, 500);
            }
        }

        function toggleSort() {
            var sortSection = document.getElementById("sortSection");
            var categoriesSection = document.getElementById("categoriesSection");
            if (categoriesSection.style.display === "block") {
                toggleCategories();
            }
            if (sortSection.style.display === "none" || sortSection.style.display === "") {
                sortSection.style.display = "block";
                setTimeout(() => {
                    sortSection.style.opacity = "1";
                    sortSection.style.maxHeight = "200px"; 
                    sortSection.style.transform = "translateY(0)";
                }, 10);
            } else {
                sortSection.style.opacity = "0";
                sortSection.style.maxHeight = "0";
                sortSection.style.transform = "translateY(-20px)";
                setTimeout(() => {
                    sortSection.style.display = "none";
                }, 500);
            }
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = cart.reduce((count, item) => count + item.quantity, 0);
            document.querySelector('.cart-count').textContent = cartCount;
        }

        window.onload = () => {
            updateCartCount();
            loadItems();
        };

        function loadItems() {
            const itemsContainer = document.getElementById('items-container');
            const items = JSON.parse(localStorage.getItem('items')) || [];
            itemsContainer.innerHTML = '';

            items.forEach(item => {
                if (item.isLive) {
                    const itemBox = document.createElement('div');
                    itemBox.className = 'items-box';
                    itemBox.innerHTML = `
                        <div class="image-container">
                            <div class="qty-quantity">QTY: ${item.quantity}</div>
                            <img src="${item.image}" class="image">
                            <img src="${item.image2}" class="image-hover">
                        </div>
                        <div class="info">
                            <button class="add-items-btn" onclick="addItemToCart('${item.name}')">Add To Cart</button>
                            <h2 class="items-names">${item.name}</h2>
                            <div class="category">${item.category}</div>
                        </div>
                    `;
                    itemsContainer.appendChild(itemBox);
                }
            });
        }

        function showNotification(productName, quantity) {
            var notificationMessage = document.getElementById('notificationMessage');
            notificationMessage.textContent = productName + ' has been added to your cart. ' + quantity + 'x';
            
            var notification = document.getElementById('notification');
            notification.style.display = 'flex';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 5000); 
        }

        function addItemToCart(itemName) {
            const items = JSON.parse(localStorage.getItem('items')) || [];
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const item = items.find(i => i.name === itemName);
            const cartItemIndex = cart.findIndex(i => i.name === itemName);

            if (item.quantity > 0) {
                item.quantity -= 1;
                let cartItemQuantity = 1;
                if (cartItemIndex >= 0) {
                    cart[cartItemIndex].quantity += 1;
                    cartItemQuantity = cart[cartItemIndex].quantity;
                } else {
                    cart.push({ name: item.name, quantity: 1, image: item.image });
                }
                localStorage.setItem('items', JSON.stringify(items));
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();
                loadItems();
                showNotification(item.name, cartItemQuantity);
            } else {
                alert('Item is out of stock');
            }
        }

        function filterItems(category) {
            const itemsContainer = document.getElementById('items-container');
            const items = JSON.parse(localStorage.getItem('items')) || [];
            itemsContainer.innerHTML = '';

            items.forEach(item => {
                if (item.isLive && (category === 'all' || item.category === category)) {
                    const itemBox = document.createElement('div');
                    itemBox.className = 'items-box';
                    itemBox.innerHTML = `
                        <div class="image-container">
                            <div class="qty-quantity">QTY: ${item.quantity}</div>
                            <img src="${item.image}" class="image">
                            <img src="${item.image2}" class="image-hover">
                        </div>
                        <div class="info">
                            <button class="add-items-btn" onclick="addItemToCart('${item.name}')">Add</button>
                            <h2 class="items-names">${item.name}</h2>
                            <div class="category">${item.category}</div>
                        </div>
                    `;
                    itemsContainer.appendChild(itemBox);
                }
            });
        }

        function sortItems(order) {
            const items = JSON.parse(localStorage.getItem('items')) || [];
            if (order === 'az') {
                items.sort((a, b) => a.name.localeCompare(b.name));
            } else if (order === 'za') {
                items.sort((a, b) => b.name.localeCompare(a.name));
            }
            localStorage.setItem('items', JSON.stringify(items));
            loadItems();
        }

        function searchItems() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const itemsContainer = document.getElementById('items-container');
            const items = JSON.parse(localStorage.getItem('items')) || [];
            itemsContainer.innerHTML = '';

            items.forEach(item => {
                if (item.isLive && (item.name.toLowerCase().includes(searchTerm) || item.category.toLowerCase().includes(searchTerm))) {
                    const itemBox = document.createElement('div');
                    itemBox.className = 'items-box';
                    itemBox.innerHTML = `
                        <div class="image-container">
                            <div class="qty-quantity">QTY: ${item.quantity}</div>
                            <img src="${item.image}" class="image">
                            <img src="${item.image2}" class="image-hover">
                        </div>
                        <div class="info">
                            <button class="add-items-btn" onclick="addItemToCart('${item.name}')">Add To Cart</button>
                            <h2 class="items-names">${item.name}</h2>
                            <div class="category">${item.category}</div>
                        </div>
                    `;
                    itemsContainer.appendChild(itemBox);
                }
            });
        }

        function redirectToCart() {
            window.location.href = 'Cart.html';
        }
    </script>
</body>
</html>
