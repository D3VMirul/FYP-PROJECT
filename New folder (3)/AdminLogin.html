<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background: url('img/login pages.jpg') no-repeat;
            background-size: cover; 
            background-position: center;
        }
        .login-box {
            position: relative;
            width: 400px;
            height: 500px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .5);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }
        .login-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 2em;
            color: #fff;
            text-align: center;
        }
        .input-box {
            position: relative;
            width: 310px;
            margin: 30px 0;
            border-bottom: 2px solid #fff;
        }
        .input-box label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            font-size: 1em;
            color: #fff;
            pointer-events: none;
            transition: .5s;
            font-weight: bold;
        }
        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -5px;
        }
        .input-box input {
            width: 100%;
            height: 50px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1em;
            color: #fff;
            padding: 0 35px 0 5px;
        }
        .input-box .icon {
            position: absolute;
            right: 8px;
            color: #fff;
            font-size: 1.2em;
            line-height: 57px;
        }
        .checkbox-box {
            display: flex;
            align-items: center;
            color: #fff;
            margin-bottom: 20px;
        }
        .checkbox-box input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            transform: scale(0.70);
        }
        button {
            width: 100%;
            height: 40px;
            background: #fff; 
            border: 2.5px solid #000000; 
            outline: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1em;
            color: #030303;
            font-weight: 700;
            transition: 0.3s, color 0.3s; 
        }
    </style>
</head>
<body>

    <section>
        <div class="login-box">
            <form id="login-form">
                <div class="login-header">
                    <h2>Admin Login</h2>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fa fa-user-circle" aria-hidden="true"></i></span>
                    <input type="text" id="username" name="username" required>
                    <label>User</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fa fa-unlock-alt" aria-hidden="true"></i></span>
                    <input type="password" id="password" name="password" required>
                    <label>Password</label> 
                </div>
                <div class="checkbox-box">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Show Password</label>
                </div>
                    <button type="submit">Login</button>
            </form>
        </div>
    </section>

    <script src="ScriptLogin.js"></script>

</body>
</html>
