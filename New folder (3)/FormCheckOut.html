<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            color: #333;
        }

        .container {
            width: 95%;
            margin: 50px auto;
            display: flex;
            gap: 20px;
        }

        .box {
            flex: 1;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 24px;
            color: #333;
            border-bottom: 2px solid #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        .required {
            color: red;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #f9f9f9;
            transition: border 0.3s;
            color: #333;
        }

        input.error {
            border-color: red;
        }

        .date-time-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .order-summary {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        #orderSummary {
            flex: auto;
            height: 500px;
            overflow-y: scroll;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: center;
            margin-bottom: 20px;
        }

        .totals {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        hr {
            margin: 20px 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        .cart-item .details {
            flex: 1;
            text-align: left;
        }

        .cart-item .buttons {
            display: flex;
            gap: 5px;
            align-items: center; 
        }

        .button {
            padding: 5px 10px;
            font-size: 1em;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #6a00ff;
        }

        .selected {
            background-color: #6a00ff;
        }

        .order-item span {
            margin: 0 5px;
        }

        .totals {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            border-top: 2px solid #333;
            padding-top: 15px;
            margin-top: auto;
        }

        .total-items {
            font-weight: bold;
            font-size: 18px;
        }

        .submit-btn {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            text-align: center;
        }

        .submit-btn:hover {
            background: #555;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: -55px;
        }

        .staff-student-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                margin: 20px auto;
                flex-direction: column;
                gap: 10px;
            }

            .box {
                height: auto;
            }

            .totals {
                flex-direction: column;
                align-items: flex-start;
            }

            .submit-btn {
                width: 100%;
                margin-top: 10px;
            }
        }

        .hidden {
            display: none;
        }

        .navbar {
            background-color: #333;
            padding: 1px;
            color: #fff;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="navbar">
        <h1 class="header">Checkout Page</h1>
        <div>
            <a href="Home.html"><i class="fas fa-home"></i> Home</a>
            <a href="Cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
            <a href="CategoriesItems.html"><i class="fas fa-th-list"></i> Categories</a>
        </div>
    </div>

<div class="container">
    <div class="box" style="margin-right: 10px;">
        <h2>Details Form</h2>
        <form id="checkout-form">
            <label for="full-name">Full Name <span class="required">*</span></label>
            <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>

            <label for="phone">Phone <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <div class="staff-student-buttons">
                <label for="id">Select Your Role and Enter ID <span class="required">*</span></label>
                <div>
                    <button type="button" class="button" id="staff-btn">STAFF</button>
                    <button type="button" class="button" id="student-btn">STUDENT</button>
                </div>
                <input type="text" id="id" name="id" placeholder="Enter your ID" required>
            </div>

            <div id="course-field" class="hidden">
                <label for="course">Course <span class="required">*</span></label>
                <input type="text" id="course" name="course" placeholder="Enter your course">
            </div>
            <div id="department-field" class="hidden">
                <label for="department">Department <span class="required">*</span></label>
                <input type="text" id="department" name="department" placeholder="Enter your department">
            </div>

            <div class="date-time-group">
                <div>
                    <label for="in-datetime">In DateTime</label>
                    <input type="datetime-local" id="in-datetime" name="in_datetime" required>
                </div>
            </div>

            <div class="date-time-group">
                <div>
                    <label for="out-datetime">Out DateTime</label>
                    <input type="datetime-local" id="out-datetime" name="out_datetime" required>
                </div>
            </div>

            <div class="date-time-group">
                <div>
                    <label for="delivery-address">Delivery Address <span class="required">*</span></label>
                    <input type="text" id="delivery-address" name="delivery_address" placeholder="Enter delivery address" required>
                </div>
            </div>

            <div class="date-time-group">
                <div>
                    <label for="note">Note (additional)</label>
                    <input type="text" id="note" name="note" placeholder="Add a note">
                </div>
            </div>
        </form>
    </div>

    <div class="box">
        <h2>Order Summary</h2>
        <div class="order-summary">
            <div id="orderSummary" class="order-summary-box"></div>
            <script src="Script1.js"></script>
            <div class="totals">
                <div class="total-items">
                    <span>Total Items: </span>
                    <span id="total-items">0</span>
                </div>
                <button class="submit-btn" id="submit-btn" type="button">Submit</button>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('submit-btn').addEventListener('click', function(event) {
    event.preventDefault();
    const requiredFields = document.querySelectorAll('input[required]');
    let allFilled = true;

    requiredFields.forEach(function(field) {
        field.classList.remove('error');
    });

    requiredFields.forEach(function(field) {
        if (!field.value.trim()) {
            field.classList.add('error');
            allFilled = false;
        }
    });

    if (allFilled) {
        submitOrder();
    } else {
        alert('Please fill in all required fields.');
    }
});

document.getElementById('staff-btn').addEventListener('click', function() {
    selectRole('staff');
});

document.getElementById('student-btn').addEventListener('click', function() {
    selectRole('student');
});

function selectRole(role) {
    const staffBtn = document.getElementById('staff-btn');
    const studentBtn = document.getElementById('student-btn');
    const courseField = document.getElementById('course-field');
    const departmentField = document.getElementById('department-field');

    if (role === 'staff') {
        staffBtn.classList.add('selected');
        studentBtn.classList.remove('selected');
        courseField.classList.add('hidden');
        departmentField.classList.remove('hidden');
    } else if (role === 'student') {
        studentBtn.classList.add('selected');
        staffBtn.classList.remove('selected');
        departmentField.classList.add('hidden');
        courseField.classList.remove('hidden');
    }
}

function displayCartItems() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const items = JSON.parse(localStorage.getItem('items')) || [];
    const cartItemsContainer = document.getElementById('orderSummary');
    const totalItemsElement = document.getElementById('total-items');
    let totalItems = 0;

    cartItemsContainer.innerHTML = '';

    cart.forEach(cartItem => {
        const item = items.find(i => i.name === cartItem.name);
        const itemQuantity = parseInt(cartItem.quantity);

        if (!isNaN(itemQuantity)) {
            totalItems += itemQuantity;
            const itemElement = document.createElement('div');
            itemElement.className = 'cart-item';
            itemElement.innerHTML = `
                <img src="${cartItem.image}" alt="${cartItem.name}">
                <div class="details">
                    <strong>${cartItem.name}</strong><br>
                    ${item ? item.category : 'Uncategorized'}
                </div>
                <div class="buttons">
                    <button class="button" onclick="decreaseQuantity('${cartItem.name}')">-</button>
                    <span>${cartItem.quantity}</span>
                    <button class="button" onclick="increaseQuantity('${cartItem.name}')">+</button>
                    <button class="button" onclick="removeItem('${cartItem.name}')">Remove</button>
                </div>
            `;
            cartItemsContainer.appendChild(itemElement);
        }
    });

    totalItemsElement.textContent = totalItems;
    updateItemsList();
}

function updateItemsList() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const items = JSON.parse(localStorage.getItem('items')) || [];
    const itemsListElement = document.getElementById('items-list');
    let itemsList = '';

    cart.forEach(cartItem => {
        const item = items.find(i => i.name === cartItem.name);
        itemsList += `${cartItem.name} (Qty: ${cartItem.quantity}, Category: ${item ? item.category : 'Uncategorized'})\n`;
    });

    itemsListElement.value = itemsList.trim();
}

function submitOrder() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const form = document.getElementById('checkout-form');
    const formData = new FormData(form);
    const order = {
        id: 'ORD' + new Date().getTime(), 
        customer: Object.fromEntries(formData.entries()),
        items: cart,
        delivered: false
    };

    const orders = JSON.parse(localStorage.getItem('orders')) || [];
    const existingOrder = orders.find(o => o.customer.email === order.customer.email && !o.delivered);

    if (existingOrder) {
        alert('You have already submitted an order. Please wait for it to be delivered before submitting a new one.');
        return;
    }

    const deviceOrders = orders.filter(o => o.deviceId === getDeviceId());
    if (deviceOrders.length > 0 && deviceOrders.some(o => o.customer.full_name !== order.customer.full_name)) {
        alert('You have already submitted an order with another name. Please check your Delivery status.');
        return;
    }

    order.deviceId = getDeviceId();
    orders.push(order);
    localStorage.setItem('orders', JSON.stringify(orders));
    updateTotalOrders();
    alert('Order submitted!');
    localStorage.removeItem('cart');
    window.location.href = 'Cart.html?section=delivery-status&orderId=' + order.id;
}

function getDeviceId() {
    let deviceId = localStorage.getItem('deviceId');
    if (!deviceId) {
        deviceId = 'DEV' + new Date().getTime();
        localStorage.setItem('deviceId', deviceId);
    }
    return deviceId;
}

function updateTotalOrders() {
    const totalOrders = JSON.parse(localStorage.getItem('totalOrders')) || 0;
    localStorage.setItem('totalOrders', totalOrders + 1);
}

function addToCart(itemName) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const items = JSON.parse(localStorage.getItem('items')) || [];
    const itemIndex = cart.findIndex(item => item.name === itemName);
    const item = items.find(i => i.name === itemName);

    if (itemIndex > -1) {
        cart[itemIndex].quantity += 1;
    } else {
        cart.push({ name: itemName, quantity: 1, image: item.image, category: item.category });
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
}

function removeFromCart(itemName) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const itemIndex = cart.findIndex(item => item.name === itemName);

    if (itemIndex > -1) {
        cart[itemIndex].quantity -= 1;
        if (cart[itemIndex].quantity <= 0) {
            cart.splice(itemIndex, 1);
        }
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
}

function removeItem(itemName) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const itemIndex = cart.findIndex(item => item.name === itemName);

    if (itemIndex > -1) {
        cart.splice(itemIndex, 1);
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
}

function fillFormWithQueryParams() {
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.forEach((value, key) => {
        const input = document.getElementById(key);
        if (input) {
            input.value = value;
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    displayCartItems();
    fillFormWithQueryParams();
});

window.onload = () => {
    displayCartItems();
    fillFormWithQueryParams();
};

function increaseQuantity(itemName) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const itemIndex = cart.findIndex(item => item.name === itemName);

    if (itemIndex > -1) {
        cart[itemIndex].quantity += 1;
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCartItems();
    }
}

function decreaseQuantity(itemName) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const itemIndex = cart.findIndex(item => item.name === itemName);

    if (itemIndex > -1) {
        cart[itemIndex].quantity -= 1;
        if (cart[itemIndex].quantity <= 0) {
            cart.splice(itemIndex, 1);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCartItems();
    }
}
</script>

</body>
</html>
