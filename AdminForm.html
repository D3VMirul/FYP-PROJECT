<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Received</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            display: flex;
            justify-content: center;
        }

        .box {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        h2, h3 {
            color: #6a00ff;
            border-bottom: 2px solid #6a00ff;
            padding-bottom: 10px;
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #007bff;
        }

        .form-group input, .form-group textarea {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            font-size: 16px;
        }

        .form-group input[readonly], .form-group textarea[readonly] {
            background-color: #e9ecef;
        }

        .role-id {
            background-color: #6a00ff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .order-summary-box {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
            border-radius: 5px;
        }

        .cart-item .details {
            flex: 1;
            text-align: left;
        }

        .cart-item .details strong {
            display: block;
            margin-bottom: 5px;
            color: #6a00ff;
        }

        .cart-item .quantity {
            font-size: 16px;
            color: #6a00ff;
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .total-items {
            font-size: 18px;
            font-weight: bold;
            color: #6a00ff;
            margin-top: 20px;
        }

        .toggle-form-button {
            margin: 20px auto;
            display: block;
            background-color: #6a00ff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .toggle-form-button:hover {
            background-color: #0056b3;
        }

        .order-id {
            font-size: 14px;
            color: white;
            margin-top: 5px;
        }

        .combined-box {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .box-half {
            width: 48%;
        }

        .totals-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            margin-top: 20px;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        .totals-line .status {
            background-color: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .confirmation-box {
            display: none;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
        }

        .confirmation-box button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .confirmation-box .sure {
            background-color: #28a745;
            color: white;
        }

        .confirmation-box .not-sure {
            background-color: #dc3545;
            color: white;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .buffering {
            display: none;
            text-align: center;
            font-size: 18px;
            color: #007bff;
        }

    </style>
</head>

<body>
    <button class="toggle-form-button" onclick="toggleForm()">ORDER 1<div class="order-id">ID: ORD123456</div></button>
    
    <div class="form-container" id="formContainer">
        <div class="container">
            <div class="box">
                <h2>Order Received</h2>
                <div class="combined-box">
                    <div class="box-half">
                        <h3>Details Form</h3>
                        <div class="form-group">
                            <label for="full-name">Full Name:</label>
                            <input type="text" id="full-name" name="full_name" value="John Doe" readonly>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone:</label>
                            <input type="tel" id="phone" name="phone" value="+123456789" readonly>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" value="johndoe@example.com" readonly>
                        </div>
                        <hr>
                        <div class="role-id">
                            Staff / ID: ST123456
                        </div>
                        <hr>
                        <div class="form-group">
                            <label for="delivery-address">Delivery Address:</label>
                            <input type="text" id="delivery-address" name="delivery_address" value="123 Main St, City, Country" readonly>
                        </div>
                        <div class="form-group">
                            <label for="note">Note:</label>
                            <textarea id="note" name="note" rows="3" readonly>Leave at the front door.</textarea>
                        </div>
                        <div class="form-group">
                            <label for="in-date-time">In Date/Time:</label>
                            <input type="datetime-local" id="in-date-time" name="in_date_time" value="2025-02-14T10:00" readonly>
                        </div>
                        <div class="form-group">
                            <label for="out-date-time">Out Date/Time:</label>
                            <input type="datetime-local" id="out-date-time" name="out_date_time" value="2025-02-14T18:00" readonly>
                        </div>
                    </div>
                    <div class="box-half">
                        <h3>Order Summary</h3>
                        <div id="orderSummary" class="order-summary-box">
                            <div class="cart-item">
                                <img src="item1.jpg" alt="Item 1">
                                <div class="details">
                                    <strong>Item 1</strong>
                                </div>
                                <div class="quantity">2</div>
                            </div>
                            <div class="cart-item">
                                <img src="item2.jpg" alt="Item 2">
                                <div class="details">
                                    <strong>Item 2</strong>
                                </div>
                                <div class="quantity">1</div>
                            </div>
                        </div>
                        <div class="totals-line">
                            <span>Total Items: 3</span>
                            <span class="status" onclick="showConfirmation()">Delivered</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="confirmation-box" id="confirmationBox">
        <p>Are You Sure This Items Has Delivered ?</p>
        <button class="sure" onclick="confirmDelivery()">I am Sure</button>
        <button class="not-sure" onclick="closeConfirmation()">I Not Sure</button>
    </div>

    <div class="buffering" id="buffering">Processing...</div>
    
    <script>
        function toggleForm() {
            var formContainer = document.getElementById('formContainer');
            var button = document.querySelector('.toggle-form-button');
            
            if (formContainer.style.display === 'none' || formContainer.style.display === '') {
                formContainer.style.display = 'block';
            } else {
                formContainer.style.display = 'none';
            }
        }

        function showConfirmation() {
            document.getElementById('confirmationBox').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeConfirmation() {
            document.getElementById('confirmationBox').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function confirmDelivery() {
            document.getElementById('buffering').style.display = 'block';
            setTimeout(() => {
                document.getElementById('buffering').style.display = 'none';
                closeConfirmation();
            }, 2000); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formContainer').style.display = 'none';
        });
    </script>
</body>

</html>
