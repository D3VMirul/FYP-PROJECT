<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CART</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #333;
            padding: 10px;
            color: #fff;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 50px); 
        }
        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 15px;
            text-align: center; 
            cursor: pointer;
            width: 50%; 
            font-weight: bold; 
        }
        th {
            background-color: #f2f2f2;
        }
        th:hover, td:hover {
            background-color: #d0d0d0; 
        }
        .active {
            background-color: #007BFF;
            color: #fff;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: center; 
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background-color: #fafafa;
            overflow: hidden; 
        }
        .header {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        #list-items {
            flex: 1;
            overflow-y: auto; 
        }
        .checkout-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            margin-top: auto; 
        }
        .total-items {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .checkout-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 150px; 
            font-weight: bold; 
        }
        .checkout-button:hover {
            background-color: #0056b3;
        }
        .form-container {
            display: none;
            text-align: left;
            margin-top: 20px;
        }
        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-container button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
        }
        .cart-item .details {
            flex: 1;
            text-align: center; 
            margin-left: 10px;
        }
        .cart-item .quantity {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .cart-item .button {
            padding: 5px 10px;
            font-size: 1em;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .cart-item .button:hover {
            background-color: #0056b3;
        }
        .cart-item .quantity span {
            min-width: 20px; 
            text-align: center;
        }
        .order-details-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }
        .order-details {
            flex: 1;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .order-details h3 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #007BFF;
        }
        .order-details p {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .order-details ul {
            list-style-type: none;
            padding: 0;
        }
        .order-details ul li {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .remove-icon {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .remove-icon:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1 class="header">MY CART</h1>
        <div>
            <a href="Home.html"><i class="fas fa-home"></i> Home</a>
            <a href="CategoriesItems.html"><i class="fas fa-th-list"></i> Categories</a>
        </div>
    </div>
    <div class="container">
        <div class="button-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="showContent('list-items', this)">List items</th>
                        <th onclick="showContent('delivery-status', this)">Delivery Status</th>
                    </tr>
                </thead>
            </table>
        </div>
        <div id="list-items" class="content">
            <div id="cart-items-container">
            </div>
            <div class="checkout-container">
                <div class="total-items">
                    <span>Total Items: </span>
                    <span id="total-items">0</span>
                </div>
                <button class="checkout-button" onclick="redirectToCheckout()">Proceed To CheckOut</button>
            </div>
        </div>
        <div id="delivery-status" class="content">
            <div class="order-details-container">
                <div class="form-container" id="order-form">
                    <form id="delivery-form">
                        <label for="receive-date">Date & Time to Receive Items:</label>
                        <input type="datetime-local" id="receive-date" name="receive-date" required>
                        <label for="return-date">Date & Time to Return Items:</label>
                        <input type="datetime-local" id="return-date" name="return-date" required>
                        <label for="note">Note:</label>
                        <textarea id="note" name="note" rows="4" required>Generated note...</textarea>
                        <label for="items-list">List of Items:</label>
                        <textarea id="items-list" name="items-list" rows="4" readonly></textarea>
                        <button type="submit">Submit</button>
                    </form>
                </div>
                <div class="order-details">
                    <h3>Order ID: <span id="order-id">000001</span></h3>
                    <p><strong>In Date/Time:</strong> <span id="in-datetime"></span></p>
                    <p><strong>Out Date/Time:</strong> <span id="out-datetime"></span></p>
                    <p><strong>Items:</strong></p>
                    <ul id="items-list-display"></ul>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showContent(id, element) {
            var contents = document.getElementsByClassName('content');
            for (var i = 0; i < contents.length; i++) {
                contents[i].style.display = 'none';
            }
            document.getElementById(id).style.display = 'flex';

            var headers = document.querySelectorAll('th');
            headers.forEach(function(header) {
                header.classList.remove('active');
            });

            element.classList.add('active');
        }

        function hideListItems() {
            document.getElementById('list-items').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const section = urlParams.get('section');
            if (section === 'delivery-status') {
                showContent('delivery-status', document.querySelector('th[onclick="showContent(\'delivery-status\', this)"]'));
                fillFormWithQueryParams();
                displayOrderDetails();
            } else {
                showContent('list-items', document.querySelector('th[onclick="showContent(\'list-items\', this)"]'));
            }
            displayCartItems();
        });

        function fillFormWithQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.forEach((value, key) => {
                const input = document.getElementById(key);
                if (input) {
                    input.value = value;
                }
            });
        }

        function displayOrderDetails() {
            const order = JSON.parse(localStorage.getItem('order'));
            if (order) {
                document.getElementById('order-id').textContent = order.id;
                document.getElementById('in-datetime').textContent = order.customer.in_datetime;
                document.getElementById('out-datetime').textContent = order.customer.out_datetime;
                const itemsListDisplay = document.getElementById('items-list-display');
                itemsListDisplay.innerHTML = '';
                order.items.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.textContent = item.name;
                    itemsListDisplay.appendChild(listItem);
                });
            }
        }

        document.getElementById('delivery-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const queryString = new URLSearchParams(formData).toString();
            window.location.href = 'Cart.html?' + queryString;
        });

        function displayCartItems() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const items = JSON.parse(localStorage.getItem('items')) || [];
            const cartItemsContainer = document.getElementById('cart-items-container');
            const totalItemsElement = document.getElementById('total-items');
            let totalItems = 0;

            cartItemsContainer.innerHTML = '';

            cart.forEach(cartItem => {
                const item = items.find(i => i.name === cartItem.name);
                totalItems += cartItem.quantity;
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <img src="${cartItem.image}" alt="${cartItem.name}">
                    <div class="details">
                        <h2>${cartItem.name}</h2>
                        <p>${item ? item.category : 'Uncategorized'}</p>
                    </div>
                    <div class="quantity">
                        <button class="button" onclick="decreaseQuantity('${cartItem.name}')">-</button>
                        <span>${cartItem.quantity}</span>
                        <button class="button" onclick="increaseQuantity('${cartItem.name}')">+</button>
                        <button class="button" onclick="removeItem('${cartItem.name}')">Remove</button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemElement);
            });

            totalItemsElement.textContent = totalItems;
        }

        function increaseQuantity(itemName) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const itemIndex = cart.findIndex(item => item.name === itemName);

            if (itemIndex > -1) {
                cart[itemIndex].quantity += 1;
                localStorage.setItem('cart', JSON.stringify(cart));
                displayCartItems();
            }
        }

        function decreaseQuantity(itemName) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const itemIndex = cart.findIndex(item => item.name === itemName);

            if (itemIndex > -1) {
                cart[itemIndex].quantity -= 1;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                displayCartItems();
            }
        }

        function removeItem(itemName) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const itemIndex = cart.findIndex(item => item.name === itemName);

            if (itemIndex > -1) {
                cart.splice(itemIndex, 1);
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            displayCartItems();
        }

        function redirectToCheckout() {
            window.location.href = 'FormCheckOut.html';
        }
    </script>
</body>
</html>
